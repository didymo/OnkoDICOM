# 127, the length flake8's advisory run used (Stuart, 16 Nov). The reformat to it comes in a commit of its own.
line-length = 127
extend-exclude = [".venv-oct"]

[format]
quote-style = "double"

[lint]
# The gate CI enforces, the same rules flake8 blocked on: syntax errors, comparison misuse, statement errors, undefined names.
select = ["E9", "F63", "F7", "F82"]

[lint.mccabe]
max-complexity = 10
