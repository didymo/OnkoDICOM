# Install once per clone: `uvx pre-commit install`.
# Until the reformat to 127 has landed, the three hooks that rewrite whole files (ruff-format, trailing-whitespace,
# end-of-file-fixer) are `stages: [manual]`: a commit does not run them, so a small change cannot carry a reformat of
# the whole file it touches (Cyril, Connor). The reformat itself runs them by hand:
#   uvx pre-commit run --all-files --hook-stage manual
# The PR after the reformat removes the three `stages: [manual]` lines, so they run on every commit from then on.
# Best practice without nitpicking (Stuart, 16 Nov): the formatter, the CI lint gate, a lock that matches
# pyproject.toml, and checks for mistakes nobody means to commit.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5  # the ruff in uv.lock
    hooks:
      - id: ruff-check  # ruff.toml's gate, the same one CI runs
      - id: ruff-format  # ruff.toml's [format]: 127 characters, double quotes
        stages: [manual]
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.8  # the uv CI pins
    hooks:
      - id: uv-lock  # uv.lock must match pyproject.toml
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [manual]
      - id: end-of-file-fixer
        stages: [manual]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
