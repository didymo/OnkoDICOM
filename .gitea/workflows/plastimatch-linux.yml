# The plastimatch tests on Linux (#26), on the HP's WSL2 Ubuntu 24.04 runner, against Ubuntu's own plastimatch
# (apt 1.9.4, installed on the runner by Stuart). The macOS job in ci.yml runs the whole suite with Stuart's port;
# this one runs only the tests marked `plastimatch`, against the build most Linux users will have.
#
# Host mode, as the `gitea-runner` account, with no sudo: uv provides Python 3.12, and Poetry builds the project's
# own .venv in the checkout from poetry.lock. Nothing is installed into any Python the host uses.
name: plastimatch-linux
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .gitea/workflows/plastimatch-linux.yml
      - src/Model/Plastimatch.py
concurrency:
  group: plastimatch-linux-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  plastimatch:
    # The HP's label alone: `linux` and `ubuntu-latest` may also be carried by the arm64 Ubuntu runner, which has no
    # plastimatch (Ubuntu builds it for amd64 only).
    runs-on: hp-linux-canary
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      TEST_DATA_URL: https://zenodo.org/record/5147737/files/DICOM-RT-02.zip
      TEST_DATA_MD5: fc63b61b121a57779345c60b92a32b15
    steps:
      - name: Runner
        run: |
          echo "runner host: $(hostname), $(. /etc/os-release && echo "$PRETTY_NAME"), $(uname -m)"
          command -v plastimatch
          plastimatch --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: uv, pinned
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.9.9"
      - name: Python 3.12 and Poetry 1.8.5
        run: |
          uv python install 3.12
          echo "PY=$(uv python find 3.12)" >> "$GITHUB_ENV"
      - name: Runner disk (before)
        run: |
          df -h "$HOME" /
          du -sh "$HOME"/.cache/* 2>/dev/null || true
      # The versions are poetry.lock's, exported, with one exception: on Linux x86_64 the lock's torch brings 15 CUDA
      # packages, several GB, which this GPU-less runner can't use. They are dropped, and torch comes from PyTorch's
      # CPU index at the same version.
      - name: Install dependencies (poetry.lock exported, torch CPU-only, in-project .venv)
        run: |
          req="$RUNNER_TEMP/requirements.txt"
          uvx --from poetry==1.8.5 poetry export --with dev --without-hashes -o "$req.all"
          grep -v -E '^(nvidia-|triton==)' "$req.all" > "$req"
          echo "dropped: $(grep -c -E '^(nvidia-|triton==)' "$req.all") CUDA packages"
          uv venv --python "$PY" .venv
          uv pip install --python .venv/bin/python -r "$req" \
            --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
          .venv/bin/python -c 'import torch; print("torch", torch.__version__)'
      - name: Runner disk (after)
        if: always()
        run: |
          df -h "$HOME" /
          du -sh "$HOME"/.cache/* 2>/dev/null || true
      # Offscreen Qt still needs some system libraries. Name any that are missing before the tests fail obscurely. Only
      # the offscreen platform plugin and the Qt modules the app loads are checked: PySide6 also ships WebEngine,
      # multimedia and xcb libraries whose dependencies an offscreen run never loads.
      - name: PySide6 system libraries (offscreen)
        run: |
          qt="$(.venv/bin/python -c 'import PySide6, os; print(os.path.dirname(PySide6.__file__))')"
          missing="$(ldd "$qt/Qt/plugins/platforms/libqoffscreen.so" "$qt"/Qt/lib/libQt6{Core,Gui,Widgets,DBus,OpenGL}.so.6 \
            | grep 'not found' | sort -u || true)"
          if [ -n "$missing" ]; then
            echo "::error::system libraries PySide6 needs are missing:"
            echo "$missing"
            exit 1
          fi
          .venv/bin/python -c 'from PySide6.QtWidgets import QApplication; QApplication([]); print("Qt offscreen OK")'
      # The zip is cached on the runner and checked against Zenodo's md5; the tests rewrite the data, so it is
      # unzipped fresh every run.
      - name: Test data (DICOM-RT-02, unzipped fresh into both data directories)
        run: |
          cache="$HOME/.cache/kindled-ci/onkodicom"
          zip="$cache/DICOM-RT-02.zip"
          mkdir -p "$cache"
          md5() { md5sum "$1" | cut -d' ' -f1; }
          if [ ! -f "$zip" ] || [ "$(md5 "$zip")" != "$TEST_DATA_MD5" ]; then
            part="$(mktemp "$cache/DICOM-RT-02.zip.XXXXXX")"
            trap 'rm -f "$part"' EXIT
            curl -fsSL --retry 3 -o "$part" "$TEST_DATA_URL"
            got="$(md5 "$part")"
            if [ "$got" != "$TEST_DATA_MD5" ]; then
              echo "::error::DICOM-RT-02.zip md5 $got, expected $TEST_DATA_MD5"
              exit 1
            fi
            mv "$part" "$zip"
          fi
          rm -rf test/testdata test/batchtestdata
          mkdir -p test/testdata test/batchtestdata
          unzip -q "$zip" -d test/testdata
          unzip -q "$zip" -d test/batchtestdata
      # SCIFIO_PATH names an empty directory of this job's own, as in ci.yml. Harmless where ITK has no SCIFIO module.
      # Only the tests marked plastimatch run. pytest exits 5 when none are collected, and that fails the job: a
      # renamed marker must not turn this into a green run that tested nothing.
      - name: Tests marked plastimatch (offscreen; a hang is cut at 900 s with its stack)
        run: |
          home="$(mktemp -d)"
          scifio="$(mktemp -d)"
          trap 'rm -rf "$home" "$scifio"' EXIT
          HOME="$home" SCIFIO_PATH="$scifio" .venv/bin/python -m pytest test/ -m plastimatch -v \
            --timeout=900 --timeout-method=thread
