# The whole test suite on Windows (#26), on our Windows runners (the HP or the Lenovo, whichever is free).
# Upstream's GitHub workflow runs Windows with continue-on-error, which hides failures. This one doesn't.
#
# plastimatch 1.9.4 for Windows is unpacked into this job's own folder (msiexec /a), not installed, so nothing is
# installed on the PC. uv provides Python 3.12, and Poetry builds the project's .venv in the checkout.
name: windows
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .gitea/workflows/windows.yml
      - src/**
      - test/**
      - pytest.ini
      - pyproject.toml
      - poetry.lock
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: powershell
jobs:
  tests:
    runs-on: windows
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      TEST_DATA_URL: https://zenodo.org/record/5147737/files/DICOM-RT-02.zip
      TEST_DATA_MD5: fc63b61b121a57779345c60b92a32b15
      PLASTIMATCH_URL: https://downloads.sourceforge.net/project/plastimatch/Windows%20Binaries/Plastimatch-1.9.4-win64.msi
      PLASTIMATCH_SHA256: 0bf179f058b7214969c5201991d07b3dbb67378175039e0fe92285e8c6e06daf
    steps:
      # Don't fill the PC's disk (Stuart, 2 Oct): refuse below 20 GB free on C:.
      - name: "Free space on C:"
        run: |
          $free = [math]::Round((New-Object System.IO.DriveInfo 'C').AvailableFreeSpace / 1GB, 1)
          "runner: $env:COMPUTERNAME, C: free $free GB"
          if ($free -lt 20) { throw "C: has $free GB free, below 20 GB: refusing" }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: uv, pinned
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.9.9"
      - name: Python 3.12 and dependencies (poetry.lock, in-project .venv)
        run: |
          $ErrorActionPreference = 'Stop'
          uv python install 3.12
          if ($LASTEXITCODE) { throw "uv python install failed" }
          $py = uv python find 3.12
          uvx --from poetry==1.8.5 poetry env use $py
          if ($LASTEXITCODE) { throw "poetry env use failed" }
          uvx --from poetry==1.8.5 poetry install --no-root
          if ($LASTEXITCODE) { throw "poetry install failed" }
          .venv\Scripts\python --version
      - name: plastimatch 1.9.4 (unpacked into this job's folder, not installed)
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = "$env:RUNNER_TEMP\plastimatch.msi"
          $dir = "$env:RUNNER_TEMP\plastimatch"
          curl.exe -fsSL --retry 3 -o $msi $env:PLASTIMATCH_URL
          if ($LASTEXITCODE) { throw "plastimatch download failed" }
          $got = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:PLASTIMATCH_SHA256) { throw "plastimatch MSI sha256 $got, expected $env:PLASTIMATCH_SHA256" }
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$dir`""
          if ($p.ExitCode) { throw "msiexec /a exited $($p.ExitCode)" }
          $exe = Get-ChildItem $dir -Recurse -Filter plastimatch.exe | Select-Object -First 1
          if (-not $exe) { throw "no plastimatch.exe after unpacking the MSI" }
          & $exe.FullName --version
          if ($LASTEXITCODE) { throw "plastimatch --version failed" }
          Add-Content $env:GITHUB_PATH $exe.DirectoryName
      - name: Test data (DICOM-RT-02, unzipped fresh into both data directories)
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "$env:RUNNER_TEMP\DICOM-RT-02.zip"
          curl.exe -fsSL --retry 3 -o $zip $env:TEST_DATA_URL
          if ($LASTEXITCODE) { throw "test data download failed" }
          $got = (Get-FileHash $zip -Algorithm MD5).Hash.ToLower()
          if ($got -ne $env:TEST_DATA_MD5) { throw "DICOM-RT-02.zip md5 $got, expected $env:TEST_DATA_MD5" }
          foreach ($d in 'test\testdata', 'test\batchtestdata') {
            if (Test-Path $d) { Remove-Item $d -Recurse -Force }
            Expand-Archive $zip -DestinationPath $d
          }
      # HOME (USERPROFILE on Windows) is this job's own, so the app's ~/.OnkoDICOM doesn't carry over between jobs.
      - name: Tests (whole suite, offscreen; a hang is cut at 900 s with its stack)
        run: |
          $home_dir = "$env:RUNNER_TEMP\home"
          New-Item -ItemType Directory -Force $home_dir | Out-Null
          $env:USERPROFILE = $home_dir
          $env:HOME = $home_dir
          .venv\Scripts\python -m pytest test/ -v --durations=10 --timeout=900 --timeout-method=thread
          exit $LASTEXITCODE
