# The whole test suite on Windows (#26), on our Windows runners (the HP or the Lenovo, whichever is free).
# Upstream's GitHub workflow runs Windows with continue-on-error, which hides failures. This one doesn't.
#
# plastimatch 1.9.4 for Windows is unpacked into this job's own folder (msiexec /a), not installed, so nothing is
# installed on the PC. uv provides Python 3.12, creates .venv in the checkout, and installs poetry.lock's versions
# into it (exported by Poetry, which can't install here itself).
name: windows
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .gitea/workflows/windows.yml
      - src/**
      - test/**
      - pytest.ini
      - pyproject.toml
      - poetry.lock
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: powershell
jobs:
  tests:
    runs-on: windows
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      TEST_DATA_URL: https://zenodo.org/record/5147737/files/DICOM-RT-02.zip
      TEST_DATA_MD5: fc63b61b121a57779345c60b92a32b15
      PLASTIMATCH_URL: https://downloads.sourceforge.net/project/plastimatch/Windows%20Binaries/Plastimatch-1.9.4-win64.msi
      PLASTIMATCH_SHA256: 0bf179f058b7214969c5201991d07b3dbb67378175039e0fe92285e8c6e06daf
    steps:
      # Don't fill the PC's disk (Stuart, 2 Oct): refuse below 20 GB free on C:.
      - name: "Free space on C:"
        run: |
          $free = [math]::Round((New-Object System.IO.DriveInfo 'C').AvailableFreeSpace / 1GB, 1)
          "runner: $env:COMPUTERNAME, C: free $free GB"
          if ($free -lt 20) { throw "C: has $free GB free, below 20 GB: refusing" }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv's package cache is kept between jobs in a short folder of its own: under the runner's profile folder,
      # the paths of packages uv builds from source pass Windows' 260-character limit (nnunetv2's build fails).
      # enable-cache: false: no upload to Gitea's cache server, and no pruning.
      - name: uv, pinned
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.9.9"
          cache-local-path: C:\uvc
          enable-cache: false
      - name: Python 3.12 and dependencies (poetry.lock exported, installed by uv)
        run: |
          $ErrorActionPreference = 'Stop'
          uv python install 3.12
          if ($LASTEXITCODE) { throw "uv python install failed" }
          $py = uv python find 3.12
          # poetry.lock's versions, exported and installed by uv, as in plastimatch-linux.yml. Poetry's own install fails
          # here: it can't build pyradiomics from its git checkout on Windows (cl.exe can't find radiomics/src/*.c).
          $req = "$env:RUNNER_TEMP\requirements.txt"
          # Poetry 2.5.1, which wrote the lock: 1.8.5 exports the Python 3.10 entries for 3.12 too (#51).
          uvx --from poetry==2.5.1 --with poetry-plugin-export==1.10.1 poetry export --with dev --without-hashes -o $req
          if ($LASTEXITCODE) { throw "poetry export failed" }
          uv venv --python $py .venv
          if ($LASTEXITCODE) { throw "uv venv failed" }
          uv pip install --python .venv\Scripts\python.exe -r $req
          if ($LASTEXITCODE) { throw "uv pip install failed" }
          .venv\Scripts\python --version
      - name: plastimatch 1.9.4 (unpacked into this job's folder, not installed)
        run: |
          $ErrorActionPreference = 'Stop'
          # The MSI is kept on the PC between jobs (SourceForge is a free service: download it once, not every run).
          # A copy whose sha256 doesn't match is downloaded again; a download is checked before it replaces the copy.
          $cache = 'C:\kindled-ci\onkodicom'
          New-Item -ItemType Directory -Force $cache | Out-Null
          $msi = "$cache\Plastimatch-1.9.4-win64.msi"
          $dir = "$env:RUNNER_TEMP\plastimatch"
          if (-not (Test-Path $msi) -or (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower() -ne $env:PLASTIMATCH_SHA256) {
            $part = "$msi.$env:GITHUB_RUN_ID.part"
            curl.exe -fsSL --retry 3 -o $part $env:PLASTIMATCH_URL
            if ($LASTEXITCODE) { Remove-Item -Force -ErrorAction SilentlyContinue $part; throw "plastimatch download failed" }
            $got = (Get-FileHash $part -Algorithm SHA256).Hash.ToLower()
            if ($got -ne $env:PLASTIMATCH_SHA256) { Remove-Item -Force $part; throw "plastimatch MSI sha256 $got, expected $env:PLASTIMATCH_SHA256" }
            Move-Item -Force $part $msi
          }
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$dir`""
          if ($p.ExitCode) { throw "msiexec /a exited $($p.ExitCode)" }
          $exe = Get-ChildItem $dir -Recurse -Filter plastimatch.exe | Select-Object -First 1
          if (-not $exe) { throw "no plastimatch.exe after unpacking the MSI" }
          & $exe.FullName --version
          if ($LASTEXITCODE) { throw "plastimatch --version failed" }
          Add-Content $env:GITHUB_PATH $exe.DirectoryName
      - name: Test data (DICOM-RT-02, unzipped fresh into both data directories)
        run: |
          $ErrorActionPreference = 'Stop'
          # The zip is kept on the PC between jobs (Zenodo is a free service), checked against its md5, as on the
          # Mac and Linux runners. The data is still unzipped fresh: the tests rewrite it.
          $cache = 'C:\kindled-ci\onkodicom'
          New-Item -ItemType Directory -Force $cache | Out-Null
          $zip = "$cache\DICOM-RT-02.zip"
          if (-not (Test-Path $zip) -or (Get-FileHash $zip -Algorithm MD5).Hash.ToLower() -ne $env:TEST_DATA_MD5) {
            $part = "$zip.$env:GITHUB_RUN_ID.part"
            curl.exe -fsSL --retry 3 -o $part $env:TEST_DATA_URL
            if ($LASTEXITCODE) { Remove-Item -Force -ErrorAction SilentlyContinue $part; throw "test data download failed" }
            $got = (Get-FileHash $part -Algorithm MD5).Hash.ToLower()
            if ($got -ne $env:TEST_DATA_MD5) { Remove-Item -Force $part; throw "DICOM-RT-02.zip md5 $got, expected $env:TEST_DATA_MD5" }
            Move-Item -Force $part $zip
          }
          foreach ($d in 'test\testdata', 'test\batchtestdata') {
            if (Test-Path $d) { Remove-Item $d -Recurse -Force }
            Expand-Archive $zip -DestinationPath $d
          }
      # HOME (USERPROFILE on Windows) is this job's own, so the app's ~/.OnkoDICOM doesn't carry over between jobs.
      - name: Tests (whole suite, offscreen; a hang is cut at 900 s with its stack)
        run: |
          $home_dir = "$env:RUNNER_TEMP\home"
          New-Item -ItemType Directory -Force $home_dir | Out-Null
          $env:USERPROFILE = $home_dir
          $env:HOME = $home_dir
          .venv\Scripts\python -m pytest test/ -v --durations=10 --timeout=900 --timeout-method=thread
          exit $LASTEXITCODE
