# Gitea CI (#8), on our self-hosted Mac Studio runner. .github/workflows/ stays for GitHub's hosted runners;
# Gitea reads .gitea/workflows/ in preference to it, so pythonapp.yml (which needs sudo, apt and Windows
# runners) never runs here. Windows is covered only by GitHub's windows-2022 jobs, at push-up.
#
# Host mode: steps run directly on the runner machine as its `gitearunner` account, with no sudo. Nothing is
# installed into any Python the host uses: uv provides Python 3.12, and Poetry builds the project's own .venv
# in the checkout from poetry.lock.
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
defaults:
  run:
    shell: /opt/homebrew/bin/bash -eo pipefail {0}
jobs:
  tests:
    # The Mac Studio alone (macos-latest is also declared by the M1 Max; see dcmQTreePy's ci.yml).
    runs-on: stuart-m3ultra-canary
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      TEST_DATA_URL: https://zenodo.org/record/5147737/files/DICOM-RT-02.zip
      TEST_DATA_MD5: fc63b61b121a57779345c60b92a32b15
    steps:
      - name: Homebrew first on PATH
        run: |
          echo /opt/homebrew/sbin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: uv, pinned
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.9.9"
      # pyproject requires Python <3.13; 3.12 is what Cora measured the suite on.
      - name: Python 3.12 and Poetry 1.8.5 (the version GitHub's workflow uses)
        run: |
          uv python install 3.12
          echo "PY=$(uv python find 3.12)" >> "$GITHUB_ENV"
          echo "runner host: $(hostname)"
      - name: Install dependencies (poetry.lock, in-project .venv)
        run: |
          uvx --from poetry==1.8.5 poetry env use "$PY"
          uvx --from poetry==1.8.5 poetry install --no-root
          .venv/bin/python --version
      - name: Lint with flake8 (the error gate GitHub runs)
        run: .venv/bin/python -m flake8 . --exclude .venv --count --select=E9,F63,F7,F82 --show-source --statistics
      # The zip is cached on the runner and checked against Zenodo's md5. The unzipped data is NOT cached:
      # the tests rewrite it, so every run unzips fresh (Cora, 3 Nov).
      - name: Test data (DICOM-RT-02, unzipped fresh into both data directories)
        run: |
          cache="$HOME/.cache/kindled-ci/onkodicom"
          zip="$cache/DICOM-RT-02.zip"
          mkdir -p "$cache"
          if [ ! -f "$zip" ] || [ "$(md5 -q "$zip")" != "$TEST_DATA_MD5" ]; then
            # A download path of this job's own, so two jobs downloading at once never write one file (#15).
            # mv within the directory replaces the zip in one step.
            part="$(mktemp "$cache/DICOM-RT-02.zip.XXXXXX")"
            trap 'rm -f "$part"' EXIT
            curl -fsSL --retry 3 -o "$part" "$TEST_DATA_URL"
            got="$(md5 -q "$part")"
            if [ "$got" != "$TEST_DATA_MD5" ]; then
              echo "::error::DICOM-RT-02.zip md5 $got, expected $TEST_DATA_MD5"
              exit 1
            fi
            mv "$part" "$zip"
          fi
          rm -rf test/testdata test/batchtestdata
          mkdir -p test/testdata test/batchtestdata
          unzip -q "$zip" -d test/testdata
          unzip -q "$zip" -d test/batchtestdata
      # Tests NOT run here, each by name. Remove a line when its reason is gone.
      #  - test_batch_pyrad2pyradsr, test_batch_pyrad2csv: need plastimatch, which this runner does not have and
      #    will not get: nothing is installed on the host (Stuart, 3 Nov). GitHub's Ubuntu jobs run them at push-up.
      # HOME is per job: the app creates ~/.OnkoDICOM (and TestConfig.db) on first run, and the runner
      # account's own home must not carry it from one job to the next.
      - name: Tests (pytest, offscreen; a hang is cut at 900 s with its stack)
        run: |
          home="$(mktemp -d)"
          # Removed however pytest ends, so the persistent runner does not collect one per run (#15).
          trap 'rm -rf "$home"' EXIT
          echo "DESELECTED (not run): test_batch_pyrad2pyradsr, test_batch_pyrad2csv (plastimatch)"
          HOME="$home" .venv/bin/python -m pytest test/ -v --durations=10 \
            --timeout=900 --timeout-method=thread \
            --deselect test/test_model_batch_processes.py::test_batch_pyrad2pyradsr \
            --deselect test/test_model_batch_processes.py::test_batch_pyrad2csv
