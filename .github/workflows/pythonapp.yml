name: Python APP

on: [pull_request]

jobs:
  fetch_cache:
    name: fetch cache
    runs-on: 'ubuntu-24.04'
    env:
      TestDataUrl: 'https://zenodo.org/record/5147737/files/DICOM-RT-02.zip'

    steps:
    - name: Cache Test Data
      id: cache-TestData
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        enableCrossOsArchive: true
        lookup-only: true
        path: DICOM-RT-02.zip
        key: ${{ env.TestDataUrl }}

    - name: Download Test Data
      if: steps.cache-TestData.outputs.cache-hit != 'true'
      run: |
        sudo apt-get install wget
        wget -O DICOM-RT-02.zip $TestDataUrl


  build_Linux:
    needs: fetch_cache
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.12'
          - '3.10'
          - '3.11'
        os:
          # - 'ubuntu-20.04'
          - 'ubuntu-24.04'

    name: Build - ${{ matrix.os }} - Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    env:
      DISPLAY: ':99.0'
      TestDataUrl: 'https://zenodo.org/record/5147737/files/DICOM-RT-02.zip'
      # USER_ONKODICOM_HIDDEN: '/tmp/.onkodicom'
      
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: uv, pinned
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.8"
        enable-cache: false

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python }}

    - name: Upgrade pip and setuptools
      run: |
        pip install --upgrade pip wheel setuptools

    - name: Install plastimatch
      run: |
        sudo apt-get update
        sudo apt-get install plastimatch

    - name: Install dependencies
      run: |
        # python -m pip install --upgrade pip wheel setuptools
        uv sync --locked --python ${{ matrix.python }}

    # currently uv going straight to the github main branch for pyradiomics ~ 3.1.1
    # - name: Workaround Install pyradiomics (no-use-pep517)
    #     # https://github.com/AIM-Harvard/pyradiomics/issues/653#issuecomment-1245039225
    #     # pyradiomics 3.1.0 has a metadata mismatch
    #   run: |
    #     uv pip install pyradiomics==3.0.1

    - name: Lint with ruff
      run: |
        # stop the build if there are Python syntax errors or undefined names (the selection is in ruff.toml)
        uv run ruff check .
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run ruff check . --select C901,E501 --line-length 127 --exit-zero --statistics

    - name: Download Cached Test Data
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        enableCrossOsArchive: true
        fail-on-cache-miss: true
        path: DICOM-RT-02.zip
        key: ${{ env.TestDataUrl }}

    - name: Install test data
      run: |
        sudo apt-get install unzip
        mkdir test/testdata
        mkdir test/batchtestdata
        unzip DICOM-RT-02.zip -d test/testdata
        unzip DICOM-RT-02.zip -d test/batchtestdata
        sudo chmod -R 777 test/testdata
        sudo chmod -R 777 test/batchtestdata

    - name: Testing setup
      run: |
        # sudo mkdir -p /tmp/.onkodicom
        # sudo chmod 777 /tmp/.onkodicom
        sudo apt-get update
        sudo apt-get install xvfb libxkbcommon-x11-0 herbstluftwm libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libopengl0 libglut3.12 libglut-dev freeglut3-dev libgeos-c1v5 libgeos++-dev libgeos-dev libxcb-cursor0
        # install everything related to xcb.  libxcb-cursor0 is required for Qt >=6.5 and it has numerous dependencies
        sudo apt-get install -y libxcb1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
        # sudo Xvfb :1 -screen 0 1024x768x24 </dev/null &
        /sbin/start-stop-daemon --start --quiet --pidfile /tmp/custom_xvfb_99.pid --make-pidfile --background --exec /usr/bin/Xvfb -- :99 -screen 0 1920x1200x24 -ac +extension GLX
        sleep 3
        herbstluftwm &
        sleep 1
        # Check system resources
        free -m
        ulimit -a

    - name: Testing and Coverage with pytest
      run: |

        # First try single test file without coverage as part of debugging Ubuntu 24.04 build
        # export QT_DEBUG_PLUGINS=1
        # export PYTHONFAULTHANDLER=1
        # uv run python -m pytest "test/test_machine_learning_preprocessing.py" -v -s

        # Append this for fail under x percent "--cov-fail-under=80"
        uv run python -m pytest "test/" -v --durations=10 --cov-config=.coveragerc --cov-report term-missing --cov=.


  build_Windows:
    needs: fetch_cache
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.12'
          - '3.10'
          - '3.11'
        os:
          # - 'windows-2019'
          - 'windows-2022'

    name: Build - ${{ matrix.os }} - Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    # Tests on Windows are unstable, so the test step (below) may fail without failing the check. The job may
    # not: a failed plastimatch download or install, or any other setup step, stops the job before the tests run,
    # and must fail the check rather than leave Windows untested behind a passing one.

    env:
      DISPLAY: ':99.0' # do we need this in Windows?
      TestDataUrl: 'https://zenodo.org/record/5147737/files/DICOM-RT-02.zip'
      # OnkoDICOM requires plastimatch >= 1.9.4 (issue #20): with 1.9.0 the
      # NRRD written for the batch PyRadiomics tests could not be read back.
      PlastimatchWindowsUrl: 'https://downloads.sourceforge.net/project/plastimatch/Windows%20Binaries/Plastimatch-1.9.4-win64.msi'
      PlastimatchWindowsSha256: 0bf179f058b7214969c5201991d07b3dbb67378175039e0fe92285e8c6e06daf

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: uv, pinned
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.8"
        enable-cache: false

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python }}

    - name: Upgrade pip and setuptools
      run: |
        python.exe -m pip install --upgrade pip wheel setuptools

    - name: Install plastimatch
      run: |
        $ErrorActionPreference = 'Stop'
        # curl, not Invoke-WebRequest: from SourceForge, Invoke-WebRequest saves the HTML download page (135 KB), and
        # msiexec then fails with 1620. The download is checked against the MSI's sha256 before it is used (#20).
        curl.exe -fsSL --retry 3 -o Plastimatch.msi "${{ env.PlastimatchWindowsUrl }}"
        if ($LASTEXITCODE) { throw "plastimatch download failed (curl exit $LASTEXITCODE)" }
        $got = (Get-FileHash Plastimatch.msi -Algorithm SHA256).Hash.ToLower()
        if ($got -ne '${{ env.PlastimatchWindowsSha256 }}') { throw "Plastimatch.msi sha256 $got, expected ${{ env.PlastimatchWindowsSha256 }}" }
        # The installer's own exit code and log: a failed install must stop here, not surface later as a missing exe.
        # Compared with 0, so an exit code that could not be read stops it too (an empty one read as success before).
        $p = Start-Process msiexec -ArgumentList '/i Plastimatch.msi /passive /l*v plastimatch-msi.log' -PassThru
        $null = $p.Handle
        $p.WaitForExit()
        if ($p.ExitCode -ne 0) { Get-Content plastimatch-msi.log -Tail 40; throw "msiexec /i exited '$($p.ExitCode)'" }
        # Put on PATH the folder plastimatch.exe was actually installed in (Program Files\Plastimatch\bin, per
        # plastimatch's CMake), found rather than assumed, and stop if there is none.
        $roots = @($env:ProgramFiles, ${env:ProgramFiles(x86)}, "$env:LOCALAPPDATA\Programs") | Where-Object { $_ -and (Test-Path $_) }
        $dirs = @(Get-ChildItem $roots -Directory -Filter 'Plastimatch*')
        if (-not $dirs) { throw "no Plastimatch folder under $($roots -join ', ') after the install" }
        $exe = $dirs | Get-ChildItem -Recurse -Filter plastimatch.exe | Select-Object -First 1
        if (-not $exe) {
          Write-Host "Plastimatch folders found: $($dirs.FullName -join ', ')"
          Select-String -Path plastimatch-msi.log -Pattern 'INSTALL_ROOT|INSTALLDIR|TARGETDIR' | Select-Object -First 10
          throw "plastimatch.exe not found after the install"
        }
        Write-Host "plastimatch: $($exe.FullName)"
        Add-Content $env:GITHUB_PATH $exe.DirectoryName

    - name: Install dependencies
      run: |
        uv sync --locked --python ${{ matrix.python }}

    # currently uv going straight to the github main branch for pyradiomics ~ 3.1.1
    #    - name: Workaround Install pyradiomics (no-use-pep517)
        # https://github.com/AIM-Harvard/pyradiomics/issues/653#issuecomment-1245039225
    #  run: |
    #    uv pip install pyradiomics==3.0.1

    - name: Lint with ruff
      run: |
        # stop the build if there are Python syntax errors or undefined names (the selection is in ruff.toml)
        uv run ruff check .
        if ($LASTEXITCODE) { throw "ruff check failed (exit $LASTEXITCODE)" }
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run ruff check . --select C901,E501 --line-length 127 --exit-zero --statistics

    - name: Download Cached Test Data
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        enableCrossOsArchive: true
        fail-on-cache-miss: true
        path: DICOM-RT-02.zip
        key: ${{ env.TestDataUrl }}

    - name: Install test data
      run: |
        7z x DICOM-RT-02.zip -o${{ github.workspace }}\test\testdata
        7z x DICOM-RT-02.zip -o${{ github.workspace }}\test\batchtestdata

    - name: Testing and Coverage with pytest
      # Tests on Windows are unstable. We do not want them to fail the entire test result
      continue-on-error: true
      run: |
        # Append this for fail under x percent "--cov-fail-under=80"
        # todo: currently in Windows some tests halt. Set timeout (in seconds) as a workaround.
        cd ${{ github.workspace }}
        uv run python -m pytest "test/" -v --durations=10 --cov-config=.coveragerc --cov-report term-missing --cov=. --timeout=180
